name: Generate SYSMOD Map status

# examples/views/sysmodMapStatus.json is read-only and fully generated from the library and the examples.
# Regenerate it whenever the library, the examples, or the generator change.
on:
  push:
    paths:
      - "SYSMOD.sysml"
      - "examples/**"
      - "scripts/generate_map_status.py"
      - "scripts/generate_views_doc.py"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate sysmodMapStatus.json
        run: python scripts/generate_map_status.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- examples/views/sysmodMapStatus.json && ! git ls-files --others --exclude-standard --error-unmatch examples/views/sysmodMapStatus.json >/dev/null 2>&1; then
            echo "sysmodMapStatus.json is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/views/sysmodMapStatus.json
          git commit -m "Regenerate sysmodMapStatus.json"
          git pull --rebase
          git push
