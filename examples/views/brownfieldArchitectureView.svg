  <rect x="355" y="293" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="40" y="370" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="392" font-size="11" fill="#555" text-anchor="middle">«externalSystem»</text>
  <text x="120" y="410" font-size="14" font-weight="600" fill="#111" text-anchor="middle">energySupply</text>
  <text x="190" y="432" font-size="11" fill="#555" text-anchor="end">energyPort</text>
  <line x1="200" y1="428" x2="360" y2="428" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="421" font-size="11" fill="#222" text-anchor="middle">energySupplyInterface</text>
  <text x="352" y="445" font-size="11" fill="#555" text-anchor="end">energyPort</text>
  <rect x="195" y="423" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="355" y="423" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="150" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="880" y="172" font-size="11" fill="#555" text-anchor="middle">«externalSystem»</text>
  <text x="880" y="190" font-size="14" font-weight="600" fill="#111" text-anchor="middle">landingZone</text>
  <text x="810" y="212" font-size="11" fill="#555">dronePort</text>
  <line x1="640" y1="208" x2="800" y2="208" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="201" font-size="11" fill="#222" text-anchor="middle">landingZoneInterface</text>
  <text x="648" y="225" font-size="11" fill="#555">landingZonePort</text>
  <rect x="635" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="795" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="330" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="880" y="352" font-size="11" fill="#555" text-anchor="middle">«environmentalEffect»</text>
  <text x="880" y="370" font-size="14" font-weight="600" fill="#111" text-anchor="middle">environment</text>
  <text x="810" y="392" font-size="11" fill="#555">conditionsPort</text>
  <line x1="640" y1="388" x2="800" y2="388" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="381" font-size="11" fill="#222" text-anchor="middle">environmentInterface</text>
  <text x="648" y="405" font-size="11" fill="#555">environmentPort</text>
  <rect x="635" y="383" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="795" y="383" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="512" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
