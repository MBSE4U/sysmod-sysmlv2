<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::productArchitectureView : SYSMODViews::ProductArchitectureView (render asInterconnectionDiagram).
       Exposed: DD::PRJ::deliveryDroneProductContext (DD_PRODUCT::DeliveryDroneProductContext).
       Shown: the actors and interfaces inherited from the brownfield context, the system ports, the product parts
       drones, controlStation and droneDocks with their ports and the connections drones.radioPort - controlStation.radioPort
       and drones.chargingPort - droneDocks.chargingPort, the inherited connection droneDocks - controlStation, and the
       inherited interface landingZonePort - drones.landingZonePort. The inherited part-level connections
       drones - droneDocks and drones - controlStation are omitted because they parallel the port connections.
       The nested parts of drones are inherited from the brownfield and system idea DeliveryDrone; of their internal
       connections only the air-charging chain (airCharger - airChargerAdapter - battery) is drawn.
       Illustrative example only; the view usage is not (yet) part of the example model. -->
  <rect width="1000" height="600" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] productArchitectureView : ProductArchitectureView — Delivery Drone product architecture</text>

  <!-- Context -->
  <rect x="10" y="42" width="980" height="520" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="22" y="60" font-size="11" fill="#555">«systemContext»</text>
  <text x="22" y="77" font-size="14" font-weight="600" fill="#222">deliveryDroneProductContext : DeliveryDroneProductContext</text>

  <!-- System of interest -->
  <rect x="262" y="100" width="476" height="445" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
  <text x="274" y="118" font-size="11" fill="#555">«system»</text>
  <text x="274" y="135" font-size="13" font-weight="600" fill="#222">deliveryDroneProduct : DeliveryDroneProductSystem</text>

  <!-- Interfaces actor - system -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="147" y1="220" x2="257" y2="220"/>
    <line x1="147" y1="400" x2="257" y2="400"/>
    <line x1="743" y1="180" x2="853" y2="180"/>
    <line x1="743" y1="330" x2="853" y2="330"/>
    <line x1="743" y1="470" x2="853" y2="470"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="254" y="214" text-anchor="end">operatorPort</text>
    <text x="254" y="394" text-anchor="end">payloadPort</text>
    <text x="746" y="174">landingZonePort</text>
    <text x="746" y="324">energyPort</text>
    <text x="746" y="464">environmentPort</text>
  </g>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="202" y="234">operatorInterface</text>
    <text x="202" y="414">customerInterface</text>
    <text x="798" y="194">landingZoneInterface</text>
    <text x="798" y="344">energySupplyInterface</text>
    <text x="798" y="484">environmentInterface</text>
  </g>

  <!-- Actors -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="22" y="180" width="120" height="80"/>
    <rect x="22" y="360" width="120" height="80"/>
    <rect x="858" y="140" width="120" height="80"/>
    <rect x="858" y="290" width="120" height="80"/>
    <rect x="858" y="430" width="120" height="80"/>
  </g>
  <g text-anchor="middle">
    <text x="82" y="200" font-size="11" fill="#555">«user»</text>
    <text x="82" y="217" font-size="13" font-weight="600" fill="#111">operator</text>
    <text x="82" y="380" font-size="11" fill="#555">«user»</text>
    <text x="82" y="397" font-size="13" font-weight="600" fill="#111">customer</text>
    <text x="918" y="160" font-size="11" fill="#555">«externalSystem»</text>
    <text x="918" y="177" font-size="13" font-weight="600" fill="#111">landingZone</text>
    <text x="918" y="310" font-size="11" fill="#555">«externalSystem»</text>
    <text x="918" y="327" font-size="13" font-weight="600" fill="#111">energySupply</text>
    <text x="918" y="450" font-size="10" fill="#555">«environmentalEffect»</text>
    <text x="918" y="467" font-size="13" font-weight="600" fill="#111">environment</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="134" y="242" text-anchor="end">controlPort</text>
    <text x="134" y="422" text-anchor="end">packagePort</text>
    <text x="866" y="202">dronePort</text>
    <text x="866" y="352">energyPort</text>
    <text x="866" y="492">conditionsPort</text>
  </g>

  <!-- Internal connections -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="720" y1="180" x2="733" y2="180"/>   <!-- landingZonePort - drones.landingZonePort -->
    <line x1="400" y1="360" x2="400" y2="425"/>   <!-- drones.radioPort - controlStation.radioPort -->
    <line x1="600" y1="360" x2="600" y2="425"/>   <!-- drones.chargingPort - droneDocks.chargingPort -->
    <line x1="465" y1="490" x2="535" y2="490"/>   <!-- droneDocks - controlStation -->
    <line x1="485" y1="271" x2="525" y2="271"/>   <!-- airChargerAdapter - battery -->
    <line x1="587" y1="287" x2="587" y2="305"/>   <!-- airCharger - airChargerAdapter -->
  </g>

  <!-- Product parts -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="285" y="155" width="430" height="200"/>
    <rect x="285" y="430" width="180" height="90"/>
    <rect x="535" y="430" width="180" height="90"/>
  </g>
  <text x="297" y="173" font-size="11" fill="#555">«part»</text>
  <text x="297" y="190" font-size="13" font-weight="600" fill="#111">drones : DeliveryDrone [1..*]</text>
  <g text-anchor="middle">
    <text x="375" y="470" font-size="11" fill="#555">«part»</text>
    <text x="375" y="488" font-size="13" font-weight="600" fill="#111">controlStation</text>
    <text x="625" y="470" font-size="11" fill="#555">«part»</text>
    <text x="625" y="488" font-size="13" font-weight="600" fill="#111">droneDocks [1..*]</text>
  </g>

  <!-- Nested parts of drones -->
  <g fill="#f7f9fc" stroke="#333" stroke-width="1.2">
    <rect x="300" y="205" width="100" height="32"/>
    <rect x="415" y="205" width="60" height="32"/>
    <rect x="490" y="205" width="130" height="32"/>
    <rect x="300" y="255" width="100" height="32"/>
    <rect x="415" y="255" width="70" height="32"/>
    <rect x="525" y="255" width="125" height="32"/>
    <rect x="525" y="305" width="125" height="32"/>
  </g>
  <g font-size="12" fill="#111" text-anchor="middle">
    <text x="350" y="225">engines[4..8]</text>
    <text x="445" y="225">body</text>
    <text x="555" y="225">payloadAttachment</text>
    <text x="350" y="275">controlUnit</text>
    <text x="450" y="275">battery</text>
    <text x="587" y="275">airChargerAdapter</text>
    <text x="587" y="325">airCharger[0..1]</text>
  </g>

  <!-- Ports (squares on borders) -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <!-- system ports -->
    <rect x="257" y="215" width="10" height="10"/>
    <rect x="257" y="395" width="10" height="10"/>
    <rect x="733" y="175" width="10" height="10"/>
    <rect x="733" y="325" width="10" height="10"/>
    <rect x="733" y="465" width="10" height="10"/>
    <!-- actor ports -->
    <rect x="137" y="215" width="10" height="10"/>
    <rect x="137" y="395" width="10" height="10"/>
    <rect x="853" y="175" width="10" height="10"/>
    <rect x="853" y="325" width="10" height="10"/>
    <rect x="853" y="465" width="10" height="10"/>
    <!-- drones -->
    <rect x="710" y="175" width="10" height="10"/>
    <rect x="395" y="350" width="10" height="10"/>
    <rect x="595" y="350" width="10" height="10"/>
    <!-- controlStation, droneDocks -->
    <rect x="395" y="425" width="10" height="10"/>
    <rect x="595" y="425" width="10" height="10"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="705" y="184" text-anchor="end">landingZonePort</text>
    <text x="410" y="349">radioPort</text>
    <text x="610" y="349">chargingPort</text>
    <text x="410" y="448">radioPort</text>
    <text x="610" y="448">chargingPort</text>
  </g>

  <text x="20" y="592" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
