  <line x1="605" y1="352" x2="785" y2="352" stroke="#333" stroke-width="1"/>
  <text x="695" y="367" font-size="11" fill="#555" text-anchor="middle">subject droneSystem</text>
  <rect x="800" y="290" width="180" height="84" rx="16" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
