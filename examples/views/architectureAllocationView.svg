  </g>
  <!-- row 1 -->
  <text x="30" y="122" font-size="11" fill="#555">«allocation»</text>
  <text x="30" y="139" font-size="13" fill="#111">functional2logical</text>
  <text x="220" y="122" font-size="13" fill="#111">deliveryDroneFunctionalContext</text>
  <text x="220" y="139" font-size="11" fill="#555">:&gt;&gt; functionalContext</text>
  <text x="480" y="122" font-size="13" fill="#111">deliveryDroneLogicalContext</text>
  <text x="480" y="139" font-size="11" fill="#555">:&gt;&gt; logicalContext</text>
  <text x="740" y="122" font-size="12" fill="#222">Allocation of the functional architecture</text>
  <text x="740" y="138" font-size="12" fill="#222">to the logical architecture.</text>
  <!-- row 2 -->
  <text x="30" y="180" font-size="11" fill="#555">«allocation»</text>
  <text x="30" y="197" font-size="13" fill="#111">logical2product</text>
  <text x="220" y="180" font-size="13" fill="#111">deliveryDroneLogicalContext</text>
  <text x="220" y="197" font-size="11" fill="#555">:&gt;&gt; logicalContext</text>
  <text x="480" y="180" font-size="13" fill="#111">deliveryDroneProductContext</text>
  <text x="480" y="197" font-size="11" fill="#555">:&gt;&gt; productContext</text>
  <text x="740" y="180" font-size="12" fill="#222">Allocation of the logical architecture</text>
  <text x="740" y="196" font-size="12" fill="#222">to the product architecture.</text>
  <!-- row 3 -->
  <text x="30" y="238" font-size="11" fill="#555">«allocation»</text>
  <text x="30" y="255" font-size="13" fill="#111">functionalImpl2logicalImpl</text>
  <text x="220" y="238" font-size="13" fill="#111">deliveryDroneFunctionalContextImpl</text>
  <text x="220" y="255" font-size="11" fill="#555">:&gt;&gt; functionalContextImpl</text>
  <text x="480" y="238" font-size="13" fill="#111">deliveryDroneLogicalContextImpl</text>
  <text x="480" y="255" font-size="11" fill="#555">:&gt;&gt; logicalContextImpl</text>
  <text x="740" y="238" font-size="12" fill="#222">Allocation of the white box functional</text>
  <text x="740" y="254" font-size="12" fill="#222">to the white box logical architecture.</text>
  <!-- row 4 -->
  <text x="30" y="296" font-size="11" fill="#555">«allocation»</text>
  <text x="30" y="313" font-size="13" fill="#111">logicalImpl2productImpl</text>
  <text x="220" y="296" font-size="13" fill="#111">deliveryDroneLogicalContextImpl</text>
  <text x="220" y="313" font-size="11" fill="#555">:&gt;&gt; logicalContextImpl</text>
