  <text x="305" y="367" font-size="11" fill="#555" text-anchor="middle">subject droneSystem</text>
  <rect x="410" y="290" width="180" height="84" rx="16" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="308" font-size="11" fill="#555" text-anchor="middle">«systemUseCase»</text>
  <text x="500" y="326" font-size="13" font-weight="600" fill="#111" text-anchor="middle">reportFleetStatus</text>
  <text x="500" y="343" font-size="11" fill="#222" text-anchor="middle">: ReportFleetStatus</text>
