<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::systemIdeaView : SYSMODViews::SystemIdeaView (render asInterconnectionDiagram).
       Exposed: PRJ::deliveryDroneSystemIdeaContext::** and PRJ::deliveryDroneSystemIdeaContextImpl::**
       (hypothetical view usage, not yet in the model). Shown as one diagram of the white box context
       DD_SYSTEMIDEA::DeliveryDroneSystemIdeaContextImpl: boundary, actors, and interfaces are unchanged
       from the brownfield context; the drones gain airCharger[0..1] and airChargerAdapter (connected to
       the battery). Other DeliveryDrone parts (engines, body, payloadAttachment, controlUnit) are omitted.
       Illustrative example, not generated by a tool. -->
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] systemIdeaView : SystemIdeaView — Delivery drones that recharge each other in the air</text>
  <!-- Context (outer container) -->
  <rect x="20" y="46" width="960" height="444" rx="10" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="36" y="66" font-size="11" fill="#555">«systemContext»</text>
  <text x="36" y="84" font-size="14" fill="#222"><tspan font-weight="600">deliveryDroneSystemIdeaContextImpl</tspan> : DeliveryDroneSystemIdeaContextImpl</text>

  <!-- System of interest -->
  <rect x="360" y="104" width="280" height="356" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
  <text x="500" y="124" font-size="11" fill="#555" text-anchor="middle">«system»</text>
  <text x="500" y="143" font-size="14" font-weight="600" fill="#111" text-anchor="middle">deliveryDroneSystemImpl</text>
  <text x="500" y="160" font-size="12" fill="#222" text-anchor="middle">: DeliveryDroneSystemIdeaImpl</text>

  <!-- White box: system idea with air-charging drones -->
  <rect x="376" y="170" width="236" height="148" rx="8" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="388" y="190" font-size="13" fill="#111"><tspan font-weight="600">drones</tspan> : DeliveryDrone</text>
  <rect x="392" y="206" width="130" height="32" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="457" y="227" font-size="12" font-weight="600" fill="#111" text-anchor="middle">airCharger[0..1]</text>
  <rect x="392" y="266" width="140" height="32" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="462" y="287" font-size="12" font-weight="600" fill="#111" text-anchor="middle">airChargerAdapter</text>
  <rect x="544" y="266" width="62" height="32" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="575" y="287" font-size="12" font-weight="600" fill="#111" text-anchor="middle">battery</text>
  <line x1="440" y1="238" x2="440" y2="266" stroke="#333" stroke-width="1.5"/>
  <line x1="532" y1="282" x2="544" y2="282" stroke="#333" stroke-width="1.5"/>
  <rect x="376" y="338" width="140" height="34" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="446" y="360" font-size="13" font-weight="600" fill="#111" text-anchor="middle">controlStation</text>
  <rect x="376" y="404" width="248" height="36" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="500" y="427" font-size="13" font-weight="600" fill="#111" text-anchor="middle">droneDocks[1..*]</text>
  <line x1="430" y1="318" x2="430" y2="338" stroke="#333" stroke-width="1.5"/>
  <line x1="430" y1="372" x2="430" y2="404" stroke="#333" stroke-width="1.5"/>
  <line x1="580" y1="318" x2="580" y2="404" stroke="#333" stroke-width="1.5"/>
  <line x1="612" y1="208" x2="640" y2="208" stroke="#333" stroke-width="1.5"/>
  <rect x="607" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- Actors, ports, and actor/system interfaces -->
  <rect x="40" y="110" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="132" font-size="11" fill="#555" text-anchor="middle">«user»</text>
  <text x="120" y="150" font-size="14" font-weight="600" fill="#111" text-anchor="middle">operator</text>
  <text x="190" y="172" font-size="11" fill="#555" text-anchor="end">controlPort</text>
  <line x1="200" y1="168" x2="360" y2="168" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="161" font-size="11" fill="#222" text-anchor="middle">operatorInterface</text>
  <text x="352" y="185" font-size="11" fill="#555" text-anchor="end">operatorPort</text>
  <rect x="195" y="163" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="355" y="163" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="40" y="240" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="262" font-size="11" fill="#555" text-anchor="middle">«user»</text>
  <text x="120" y="280" font-size="14" font-weight="600" fill="#111" text-anchor="middle">customer</text>
  <text x="190" y="302" font-size="11" fill="#555" text-anchor="end">packagePort</text>
  <line x1="200" y1="298" x2="360" y2="298" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="291" font-size="11" fill="#222" text-anchor="middle">customerInterface</text>
  <text x="352" y="315" font-size="11" fill="#555" text-anchor="end">payloadPort</text>
  <rect x="195" y="293" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="355" y="293" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="40" y="370" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="392" font-size="11" fill="#555" text-anchor="middle">«externalSystem»</text>
  <text x="120" y="410" font-size="14" font-weight="600" fill="#111" text-anchor="middle">energySupply</text>
  <text x="190" y="432" font-size="11" fill="#555" text-anchor="end">energyPort</text>
  <line x1="200" y1="428" x2="360" y2="428" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="421" font-size="11" fill="#222" text-anchor="middle">energySupplyInterface</text>
  <text x="352" y="445" font-size="11" fill="#555" text-anchor="end">energyPort</text>
  <rect x="195" y="423" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="355" y="423" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="150" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="880" y="172" font-size="11" fill="#555" text-anchor="middle">«externalSystem»</text>
  <text x="880" y="190" font-size="14" font-weight="600" fill="#111" text-anchor="middle">landingZone</text>
  <text x="810" y="212" font-size="11" fill="#555">dronePort</text>
  <line x1="640" y1="208" x2="800" y2="208" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="201" font-size="11" fill="#222" text-anchor="middle">landingZoneInterface</text>
  <text x="648" y="225" font-size="11" fill="#555">landingZonePort</text>
  <rect x="635" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="795" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="800" y="330" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="880" y="352" font-size="11" fill="#555" text-anchor="middle">«environmentalEffect»</text>
  <text x="880" y="370" font-size="14" font-weight="600" fill="#111" text-anchor="middle">environment</text>
  <text x="810" y="392" font-size="11" fill="#555">conditionsPort</text>
  <line x1="640" y1="388" x2="800" y2="388" stroke="#333" stroke-width="1.5"/>
  <text x="720" y="381" font-size="11" fill="#222" text-anchor="middle">environmentInterface</text>
  <text x="648" y="405" font-size="11" fill="#555">environmentPort</text>
  <rect x="635" y="383" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="795" y="383" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="20" y="512" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
