  <rect x="20" y="150" width="150" height="62" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="95" y="168" font-size="11" fill="#555" text-anchor="middle">«user»</text>
  <text x="95" y="192" font-size="14" font-weight="600" fill="#111" text-anchor="middle">operator</text>
