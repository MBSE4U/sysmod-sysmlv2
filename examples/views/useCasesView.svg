<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::useCasesView : SYSMODViews::UseCasesView (render asTreeDiagram).
       Exposed: PRJ::deliveryDroneSpecificationContext::** (hypothetical view usage, not yet in the model),
       filtered to the use cases, the actors, and the system of interest (subject) of the context.
       Membership tree of DD_SPECIFICATION::DeliveryDroneSystemContext; the keywords of the use case usages
       are taken from the metadata of their use case definitions. The use case definitions DeliveryProcess
       and BookDelivery are not owned by the context and are therefore not shown.
       Illustrative example, not generated by a tool. -->
  <rect width="1000" height="450" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] useCasesView : UseCasesView — Use cases of the specification context</text>

  <!-- Membership tree -->
  <g stroke="#333" stroke-width="1.5" fill="none">
    <path d="M500,98 L507,106 L500,114 L493,106 Z" fill="#333"/>
    <line x1="500" y1="114" x2="500" y2="268"/>
    <line x1="95" y1="128" x2="905" y2="128"/>
    <line x1="95" y1="128" x2="95" y2="150"/>
    <line x1="255" y1="128" x2="255" y2="150"/>
    <line x1="415" y1="128" x2="415" y2="150"/>
    <line x1="585" y1="128" x2="585" y2="150"/>
    <line x1="745" y1="128" x2="745" y2="150"/>
