  <text x="890" y="326" font-size="13" font-weight="600" fill="#111" text-anchor="middle">monitorDroneHealth</text>
  <text x="890" y="343" font-size="11" fill="#222" text-anchor="middle">: MonitorDroneHealth</text>
  <line x1="800" y1="352" x2="980" y2="352" stroke="#333" stroke-width="1"/>
  <text x="890" y="367" font-size="11" fill="#555" text-anchor="middle">subject droneSystem</text>
  <text x="20" y="402" font-size="12" fill="#555">Each subject droneSystem subsets deliveryDroneSystem, the system of interest of the context.</text>
  <text x="20" y="442" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
