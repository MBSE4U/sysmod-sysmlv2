<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::specificationTreeView : SYSMODViews::SpecificationTreeView (render asTreeDiagram).
       Exposed: DD::PRJ (this) and DD::PRJ::controlStationProject, filtered by @ProjectMetadata or @SysML::RequirementUsage
       or @ExtendedRequirementMetadata or @RequirementDerivation::DerivationMetadata.
       Shows the two levels of the specification tree, the parentElement of the sub-project, and the requirement flow-down
       airChargingFlowDown declared in the parent project. The building block is shown for orientation.
       Illustrative example. -->
  <defs>
    <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#333" stroke-width="1.2"/>
    </marker>
    <marker id="openBlue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f6fb0" stroke-width="1.2"/>
    </marker>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] specificationTreeView : SpecificationTreeView — Delivery Drone specification tree</text>

  <!-- Level 0: Delivery Drone Project -->
  <rect x="20" y="50" width="440" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="70" font-size="11" fill="#555" text-anchor="middle">«project»</text>
  <text x="240" y="88" font-size="14" font-weight="600" fill="#111" text-anchor="middle">'Delivery Drone Project'</text>
  <rect x="36" y="100" width="408" height="173" rx="6" fill="#f7f9fc" stroke="#333" stroke-width="1"/>
  <text x="52" y="118" font-size="11" fill="#555">«requirement»  systemRequirementSpecification</text>
  <text x="52" y="134" font-size="13" font-weight="600" fill="#111">deliveryDroneSystemRequirementsSpecification</text>
  <text x="52" y="149" font-size="11" fill="#555">: DeliveryDroneSystemRequirements</text>
  <rect x="52" y="162" width="376" height="48" rx="4" fill="#ffffff" stroke="#333" stroke-width="1"/>
  <text x="64" y="178" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="64" y="198" font-size="13" fill="#111"><tspan font-weight="600">maxPayloadMass</tspan><tspan font-size="11" fill="#555"> : MaxPayloadMass</tspan></text>
  <rect x="52" y="218" width="376" height="48" rx="4" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="64" y="234" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="64" y="254" font-size="13" fill="#111"><tspan font-weight="600">airCharging</tspan><tspan font-size="11" fill="#555"> : AirCharging</tspan></text>

  <!-- Level 1: control station sub-project -->
  <rect x="540" y="50" width="440" height="230" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="760" y="68" font-size="11" fill="#555" text-anchor="middle">«project»  :&gt; subProjects</text>
  <text x="760" y="85" font-size="14" font-weight="600" fill="#111" text-anchor="middle">controlStationProject</text>
  <text x="760" y="100" font-size="11" fill="#555" text-anchor="middle">: DeliveryDroneControlStationProject</text>
  <rect x="556" y="108" width="408" height="165" rx="6" fill="#f7f9fc" stroke="#333" stroke-width="1"/>
  <text x="572" y="124" font-size="11" fill="#555">«requirement»  systemRequirementSpecification</text>
  <text x="572" y="140" font-size="13" font-weight="600" fill="#111">controlStationRequirementSpecification</text>
  <text x="572" y="154" font-size="11" fill="#555">: ControlStationRequirements</text>
  <rect x="572" y="162" width="376" height="48" rx="4" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="584" y="178" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="584" y="198" font-size="13" fill="#111"><tspan font-weight="600">chargerAssignment</tspan><tspan font-size="11" fill="#555"> : ChargerAssignmentTime (≤ 10 s)</tspan></text>
  <rect x="572" y="218" width="376" height="48" rx="4" fill="#ffffff" stroke="#2f6fb0" stroke-width="1.8"/>
  <text x="584" y="234" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="584" y="254" font-size="13" fill="#111"><tspan font-weight="600">batteryTracking</tspan><tspan font-size="11" fill="#555"> : BatteryLevelTracking</tspan></text>

  <!-- Membership edge: subProjects -->
  <line x1="476" y1="64" x2="540" y2="64" stroke="#333" stroke-width="1.5"/>
  <polygon points="460,64 468,58 476,64 468,70" fill="#333" stroke="#333" stroke-width="1"/>
  <text x="500" y="56" font-size="11" fill="#555" text-anchor="middle">subProjects</text>

  <!-- Requirement flow-down: airChargingFlowDown (#derivation), from #original to #derive -->
  <g stroke="#2f6fb0" stroke-width="1.5" fill="none" stroke-dasharray="6 4">
    <line x1="428" y1="242" x2="572" y2="186" marker-end="url(#openBlue)"/>
    <line x1="428" y1="242" x2="572" y2="242" marker-end="url(#openBlue)"/>
  </g>
  <text x="500" y="262" font-size="11" fill="#2f6fb0" text-anchor="middle">«derivation»</text>

  <!-- Building block of the parent white box -->
  <rect x="20" y="330" width="440" height="124" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="240" y="350" font-size="11" fill="#555" text-anchor="middle">«part»  building block of deliveryDroneProductContextImpl</text>
  <text x="240" y="370" font-size="13" font-weight="600" fill="#111" text-anchor="middle">controlStation : ControlStation</text>
  <text x="240" y="390" font-size="11" fill="#555" text-anchor="middle">ports radioPort, operatorPort; attribute chargerAssignmentTime</text>
  <text x="240" y="414" font-size="11" fill="#555" text-anchor="middle">integrated (integrateSubProjects):</text>
  <text x="240" y="430" font-size="11" fill="#555" text-anchor="middle">part :&gt;&gt; controlStation : DDCS::ControlStationProductSystemImpl</text>

  <!-- parentElement -->
  <line x1="620" y1="280" x2="460" y2="392" stroke="#333" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#open)"/>
  <text x="566" y="336" font-size="11" fill="#555">parentElement</text>

  <!-- Summary -->
  <g font-size="12" fill="#555">
    <text x="20" y="488">Each level of the specification tree has its own systemRequirementSpecification. The parent project binds the parentElement</text>
    <text x="20" y="506">of the sub-project, declares the flow-down «derivation» airChargingFlowDown :&gt; requirementFlowDowns (#original airCharging,</text>
    <text x="20" y="524">#derive chargerAssignment and batteryTracking), and integrates the product system of the sub-project.</text>
  </g>

  <text x="20" y="562" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
