<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::logicalArchitectureView : SYSMODViews::LogicalArchitectureView (render asInterconnectionDiagram).
       Exposed: DD::PRJ::deliveryDroneLogicalContextImpl (DD_LOGICAL::DeliveryDroneLogicalContextImpl), the white box logical context.
       Shown: the actors and interfaces inherited from the brownfield context, the system ports, and the three
       logical building blocks of DeliveryDroneLogicalSystemImpl (with their doc text). The logical blocks have no
       ports or connections in the model, so none are drawn between them.
       Illustrative example only; the view usage is not (yet) part of the example model. -->
  <rect width="1000" height="490" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] logicalArchitectureView : LogicalArchitectureView — Delivery Drone logical architecture</text>

  <!-- Context -->
  <rect x="10" y="42" width="980" height="408" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="22" y="60" font-size="11" fill="#555">«systemContext»</text>
  <text x="22" y="77" font-size="14" font-weight="600" fill="#222">deliveryDroneLogicalContextImpl : DeliveryDroneLogicalContextImpl</text>

  <!-- System of interest -->
  <rect x="262" y="100" width="476" height="330" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
  <text x="274" y="118" font-size="11" fill="#555">«system»</text>
  <text x="274" y="135" font-size="13" font-weight="600" fill="#222">deliveryDroneSystemImpl : DeliveryDroneLogicalSystemImpl</text>

  <!-- Interfaces actor - system -->
  <g stroke="#333" stroke-width="1.5">
    <line x1="147" y1="200" x2="257" y2="200"/>
    <line x1="147" y1="340" x2="257" y2="340"/>
    <line x1="743" y1="145" x2="853" y2="145"/>
    <line x1="743" y1="265" x2="853" y2="265"/>
    <line x1="743" y1="375" x2="853" y2="375"/>
  </g>
  <g font-size="10" fill="#555">
    <text x="254" y="194" text-anchor="end">operatorPort</text>
    <text x="254" y="334" text-anchor="end">payloadPort</text>
    <text x="746" y="139">landingZonePort</text>
    <text x="746" y="259">energyPort</text>
    <text x="746" y="369">environmentPort</text>
  </g>
  <g font-size="10" fill="#222" text-anchor="middle">
    <text x="202" y="214">operatorInterface</text>
    <text x="202" y="354">customerInterface</text>
    <text x="798" y="159">landingZoneInterface</text>
    <text x="798" y="279">energySupplyInterface</text>
    <text x="798" y="389">environmentInterface</text>
  </g>

  <!-- Actors -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="22" y="160" width="120" height="80"/>
    <rect x="22" y="300" width="120" height="80"/>
    <rect x="858" y="105" width="120" height="80"/>
    <rect x="858" y="225" width="120" height="80"/>
    <rect x="858" y="335" width="120" height="80"/>
  </g>
  <g text-anchor="middle">
    <text x="82" y="180" font-size="11" fill="#555">«user»</text>
    <text x="82" y="197" font-size="13" font-weight="600" fill="#111">operator</text>
    <text x="82" y="320" font-size="11" fill="#555">«user»</text>
    <text x="82" y="337" font-size="13" font-weight="600" fill="#111">customer</text>
    <text x="918" y="125" font-size="11" fill="#555">«externalSystem»</text>
    <text x="918" y="142" font-size="13" font-weight="600" fill="#111">landingZone</text>
    <text x="918" y="245" font-size="11" fill="#555">«externalSystem»</text>
    <text x="918" y="262" font-size="13" font-weight="600" fill="#111">energySupply</text>
    <text x="918" y="355" font-size="10" fill="#555">«environmentalEffect»</text>
    <text x="918" y="372" font-size="13" font-weight="600" fill="#111">environment</text>
  </g>
  <g font-size="10" fill="#555">
    <text x="134" y="222" text-anchor="end">controlPort</text>
    <text x="134" y="362" text-anchor="end">packagePort</text>
    <text x="866" y="167">dronePort</text>
    <text x="866" y="287">energyPort</text>
    <text x="866" y="397">conditionsPort</text>
  </g>

  <!-- Logical building blocks -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="300" y="155" width="400" height="76"/>
    <rect x="300" y="245" width="400" height="76"/>
    <rect x="300" y="335" width="400" height="76"/>
  </g>
  <g font-size="11" fill="#555">
    <text x="312" y="173">«part»</text>
    <text x="312" y="263">«part»</text>
    <text x="312" y="353">«part»</text>
  </g>
  <g font-size="13" font-weight="600" fill="#111">
    <text x="312" y="190">flightControl</text>
    <text x="312" y="280">fleetCoordination</text>
    <text x="312" y="370">energyManagement</text>
  </g>
  <g font-size="11" fill="#555">
    <text x="312" y="207">Keeps each drone on its route, including the</text>
    <text x="312" y="221">air charging rendezvous.</text>
    <text x="312" y="297">Assigns deliveries and pairs charger drones</text>
    <text x="312" y="311">with low-battery drones.</text>
    <text x="312" y="387">Monitors batteries and decides when a drone</text>
    <text x="312" y="401">needs an air charge.</text>
  </g>

  <!-- Ports (squares on borders) -->
  <g fill="#ffffff" stroke="#333" stroke-width="1.5">
    <rect x="257" y="195" width="10" height="10"/>
    <rect x="257" y="335" width="10" height="10"/>
    <rect x="733" y="140" width="10" height="10"/>
    <rect x="733" y="260" width="10" height="10"/>
    <rect x="733" y="370" width="10" height="10"/>
    <rect x="137" y="195" width="10" height="10"/>
    <rect x="137" y="335" width="10" height="10"/>
    <rect x="853" y="140" width="10" height="10"/>
    <rect x="853" y="260" width="10" height="10"/>
    <rect x="853" y="370" width="10" height="10"/>
  </g>

  <text x="20" y="482" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
