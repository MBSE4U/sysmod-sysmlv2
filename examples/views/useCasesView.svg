  <text x="585" y="186" font-size="13" font-weight="600" fill="#111" text-anchor="middle">deliveryDroneSystem</text>
  <text x="585" y="203" font-size="11" fill="#222" text-anchor="middle">: DeliveryDroneSystem</text>
