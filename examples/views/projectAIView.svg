  <!-- Rendered markdown card -->
  <rect x="20" y="46" width="960" height="400" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="966" y="64" font-size="11" fill="#555" text-anchor="end">rendered markdown · asProjectFacts</text>

  <text x="44" y="98" font-size="24" font-weight="600" fill="#111">Project Delivery Drone Project</text>
  <line x1="44" y1="110" x2="956" y2="110" stroke="#eef2f7" stroke-width="2"/>

  <text x="44" y="138" font-size="14" fill="#222">Project owner: <tspan fill="#2f6fb0">John Finch</tspan></text>

  <text x="44" y="178" font-size="18" font-weight="600" fill="#111">Documentation</text>
  <line x1="44" y1="187" x2="956" y2="187" stroke="#eef2f7" stroke-width="2"/>
  <g font-size="14" fill="#222">
    <text x="44" y="212">Project Charter: Delivery Drone</text>
    <text x="44" y="238">Client: A logistics company wants to speed up last-mile deliveries to remote places and reduce delivery costs.</text>
    <text x="44" y="264">Contractor: Our company AmperDrones, an established drone manufacturer, will design and develop the</text>
    <text x="44" y="283">delivery drone system.</text>
    <text x="44" y="309">Goal: An autonomous drone system that delivers small packages faster and cheaper than the client's current</text>
    <text x="44" y="328">ground-based delivery.</text>
  </g>

  <text x="44" y="370" font-size="18" font-weight="600" fill="#111">Purpose</text>
  <line x1="44" y1="379" x2="956" y2="379" stroke="#eef2f7" stroke-width="2"/>
  <g font-size="14" fill="#222">
    <text x="44" y="404">Develop an autonomous delivery drone system that delivers small packages to remote places faster and cheaper</text>
    <text x="44" y="423">than the client's current ground-based delivery.</text>
  </g>

  <text x="20" y="472" font-size="11" fill="#777">Illustrative AI rendering based on the Delivery Drone example model.</text>
