<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::brownfieldArchitectureView : SYSMODViews::BrownfieldArchitectureView (render asInterconnectionDiagram).
       Exposed: PRJ::deliveryDroneBrownfieldContext::** and PRJ::deliveryDroneBrownfieldContextImpl::**
       (hypothetical view usage, not yet in the model). Shown as one diagram of the white box context
       DD_BROWNFIELD::DeliveryDroneSystemContextImpl, which inherits the actors, ports, and interfaces of the
       black box context. The internals of DeliveryDrone (engines, battery, body, ...) are omitted.
       Illustrative example, not generated by a tool. -->
  <rect width="1000" height="520" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] brownfieldArchitectureView : BrownfieldArchitectureView — Existing delivery drone system</text>
  <!-- Context (outer container) -->
  <rect x="20" y="46" width="960" height="444" rx="10" fill="#f7f9fc" stroke="#333" stroke-width="1.5"/>
  <text x="36" y="66" font-size="11" fill="#555">«systemContext»</text>
  <text x="36" y="84" font-size="14" fill="#222"><tspan font-weight="600">deliveryDroneBrownfieldContextImpl</tspan> : DeliveryDroneSystemContextImpl</text>

  <!-- System of interest -->
  <rect x="360" y="104" width="280" height="356" rx="10" fill="#ffffff" stroke="#2f6fb0" stroke-width="2"/>
  <text x="500" y="124" font-size="11" fill="#555" text-anchor="middle">«system»</text>
  <text x="500" y="143" font-size="14" font-weight="600" fill="#111" text-anchor="middle">deliveryDroneSystemImpl</text>
  <text x="500" y="160" font-size="12" fill="#222" text-anchor="middle">: DeliveryDroneSystemImpl</text>

  <!-- White box: internal structure of DeliveryDroneSystemImpl -->
  <rect x="376" y="178" width="228" height="56" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="201" font-size="13" font-weight="600" fill="#111" text-anchor="middle">drones[1..*]</text>
  <text x="490" y="219" font-size="12" fill="#222" text-anchor="middle">: DeliveryDrone</text>
  <rect x="376" y="290" width="144" height="36" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="448" y="313" font-size="13" font-weight="600" fill="#111" text-anchor="middle">controlStation</text>
  <rect x="376" y="384" width="228" height="40" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="490" y="409" font-size="13" font-weight="600" fill="#111" text-anchor="middle">droneDocks[1..*]</text>
  <line x1="430" y1="234" x2="430" y2="290" stroke="#333" stroke-width="1.5"/>
  <line x1="430" y1="326" x2="430" y2="384" stroke="#333" stroke-width="1.5"/>
  <line x1="575" y1="234" x2="575" y2="384" stroke="#333" stroke-width="1.5"/>
  <line x1="604" y1="208" x2="640" y2="208" stroke="#333" stroke-width="1.5"/>
  <rect x="599" y="203" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>

  <!-- Actors, ports, and actor/system interfaces -->
  <rect x="40" y="110" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="132" font-size="11" fill="#555" text-anchor="middle">«user»</text>
  <text x="120" y="150" font-size="14" font-weight="600" fill="#111" text-anchor="middle">operator</text>
  <text x="190" y="172" font-size="11" fill="#555" text-anchor="end">controlPort</text>
  <line x1="200" y1="168" x2="360" y2="168" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="161" font-size="11" fill="#222" text-anchor="middle">operatorInterface</text>
  <text x="352" y="185" font-size="11" fill="#555" text-anchor="end">operatorPort</text>
  <rect x="195" y="163" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="355" y="163" width="10" height="10" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <rect x="40" y="240" width="160" height="80" rx="8" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="120" y="262" font-size="11" fill="#555" text-anchor="middle">«user»</text>
  <text x="120" y="280" font-size="14" font-weight="600" fill="#111" text-anchor="middle">customer</text>
  <text x="190" y="302" font-size="11" fill="#555" text-anchor="end">packagePort</text>
  <line x1="200" y1="298" x2="360" y2="298" stroke="#333" stroke-width="1.5"/>
  <text x="280" y="291" font-size="11" fill="#222" text-anchor="middle">customerInterface</text>
  <text x="352" y="315" font-size="11" fill="#555" text-anchor="end">payloadPort</text>
