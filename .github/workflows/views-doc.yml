
name: Generate SYSMODViews.md

# SYSMODViews.md is read-only and fully generated from the library.
# Regenerate it whenever the library, the examples, or the generator change.
on:
  push:
    paths:
      - "SYSMOD15288.sysml"
      - "SYSMODViews.sysml"
      - "SYSMOD.sysml"
      - "examples/**"
      - "scripts/generate_views_doc.py"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SYSMODViews.md
        run: python scripts/generate_views_doc.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- SYSMODViews.md; then
            echo "SYSMODViews.md is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYSMODViews.md
          git commit -m "Regenerate SYSMODViews.md"
          git push
