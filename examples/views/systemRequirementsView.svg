<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <!-- Rendering of DD::PRJ::systemRequirementsView : SYSMODViews::SystemRequirementsView (render asElementTable).
       Exposed: DD::PRJ::deliveryDroneSystemRequirementsSpecification (hypothetical view usage; not yet declared in the project),
       filtered by @ExtendedRequirementMetadata or @SysML::RequirementUsage. Shows all requirements of the example model.
       The model has no requirement ids; the name column is used instead. Illustrative example. -->
  <rect width="1000" height="390" fill="#ffffff"/>

  <text x="20" y="28" font-size="15" font-weight="600" fill="#333">[view] systemRequirementsView : SystemRequirementsView — Delivery Drone system requirements</text>
  <text x="20" y="50" font-size="12" fill="#555">systemRequirementSpecification: deliveryDroneSystemRequirementsSpecification : DeliveryDroneSystemRequirements</text>
  <text x="20" y="66" font-size="12" fill="#555">subject deliveryDroneSystem : DeliveryDroneSystem · stakeholder projectOwner = johnFinch</text>

  <!-- Table background and rows -->
  <rect x="20" y="80" width="960" height="26" fill="#eef2f7"/>
  <rect x="20" y="106" width="960" height="54" fill="#f7f9fc"/>
  <rect x="20" y="160" width="960" height="80" fill="#ffffff"/>
  <rect x="20" y="240" width="960" height="80" fill="#f7f9fc"/>
  <g stroke="#333" stroke-width="1">
    <rect x="20" y="80" width="960" height="240" fill="none" stroke-width="1.5"/>
    <line x1="20" y1="106" x2="980" y2="106"/>
    <line x1="20" y1="160" x2="980" y2="160"/>
    <line x1="20" y1="240" x2="980" y2="240"/>
    <line x1="195" y1="80" x2="195" y2="320"/>
    <line x1="405" y1="80" x2="405" y2="320"/>
    <line x1="480" y1="80" x2="480" y2="320"/>
    <line x1="550" y1="80" x2="550" y2="320"/>
    <line x1="670" y1="80" x2="670" y2="320"/>
    <line x1="790" y1="80" x2="790" y2="320"/>
  </g>

  <!-- Header -->
  <g font-size="12" font-weight="600" fill="#222">
    <text x="28" y="98">Requirement</text>
    <text x="203" y="98">Text</text>
    <text x="413" y="98">Obligation</text>
    <text x="488" y="98">Stability</text>
    <text x="558" y="98">Stakeholder</text>
    <text x="678" y="98">Frames need</text>
    <text x="798" y="98">Motivation</text>
  </g>

  <!-- Row: root -->
  <text x="28" y="121" font-size="11" fill="#555">«requirement def»</text>
  <text x="28" y="137" font-size="13" fill="#111">DeliveryDroneSystem</text>
  <text x="28" y="152" font-size="13" fill="#111">Requirements</text>
  <g font-size="12" fill="#222">
    <text x="203" y="124">Root of the delivery drone</text>
    <text x="203" y="140">system requirements.</text>
    <text x="203" y="155" font-size="11" fill="#555">with maxPayloadMass, airCharging</text>
    <text x="413" y="124">none</text>
    <text x="488" y="124">none</text>
    <text x="558" y="124">projectOwner</text>
    <text x="678" y="124">—</text>
    <text x="798" y="124">—</text>
  </g>

  <!-- Row: maxPayloadMass -->
  <text x="28" y="176" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="28" y="193" font-size="13" fill="#111">maxPayloadMass</text>
  <text x="28" y="209" font-size="11" fill="#555">: MaxPayloadMass</text>
  <text x="28" y="224" font-size="11" fill="#555">:&gt; MaxValue (boilerplate)</text>
  <g font-size="12" fill="#222">
    <text x="203" y="178">The system shall transport</text>
    <text x="203" y="194">payloads with a mass of up to</text>
    <text x="203" y="210">5 kg.</text>
    <text x="203" y="228" font-size="11" fill="#555">maxValue 5 kg, tolerance 0.1 kg</text>
    <text x="413" y="178">mandatory</text>
    <text x="488" y="178">stable</text>
    <text x="558" y="178">logisticCompany</text>
    <text x="558" y="194" font-size="11" fill="#555">: LogisticCompany</text>
    <text x="678" y="178">LowDeliveryCost</text>
    <text x="798" y="178">Typical last-mile parcels</text>
    <text x="798" y="194">weigh less than 5 kg.</text>
  </g>

  <!-- Row: airCharging -->
  <text x="28" y="256" font-size="11" fill="#555">«extendedRequirement»</text>
  <text x="28" y="273" font-size="13" fill="#111">airCharging</text>
  <text x="28" y="289" font-size="11" fill="#555">: AirCharging</text>
  <g font-size="12" fill="#222">
    <text x="203" y="258">A drone shall be able to</text>
    <text x="203" y="274">recharge its battery during</text>
    <text x="203" y="290">flight.</text>
    <text x="413" y="258">mandatory</text>
    <text x="488" y="258" font-weight="600" fill="#2f6fb0">unstable</text>
    <text x="558" y="258">logisticCompany</text>
    <text x="558" y="274" font-size="11" fill="#555">: LogisticCompany</text>
    <text x="678" y="258">ReliableDelivery</text>
    <text x="798" y="258">Extends the delivery range</text>
    <text x="798" y="274">to remote places without</text>
    <text x="798" y="290">ground charging</text>
    <text x="798" y="306">infrastructure.</text>
  </g>

  <!-- Summary -->
  <g font-size="12" fill="#555">
    <text x="20" y="344">2 system requirements under the root, both mandatory; airCharging is still unstable.</text>
    <text x="20" y="361">Stakeholder need SafeOperation is not yet framed by any system requirement.</text>
  </g>

  <text x="20" y="382" font-size="11" fill="#777">Illustrative example based on the Delivery Drone example model.</text>
</svg>
